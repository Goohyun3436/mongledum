<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동화책 3D 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f6f1;
      color: #1d2538;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px 18px 36px;
      background:
        radial-gradient(circle at 50% 44%, #fff 0 18%, transparent 48%),
        #f7f6f1;
    }

    main {
      width: min(860px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -.04em;
    }

    p { margin: 0; color: #687083; }

    .scene {
      display: grid;
      place-items: center;
      min-height: clamp(430px, 68vw, 620px);
      perspective: 2200px;
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
    }

    .scene:active { cursor: grabbing; }

    .book {
      --book-width: min(68vw, 460px);
      --book-depth: clamp(14px, 2.4vw, 18px);
      --cover-board: clamp(3px, .7vw, 4px);
      --cover-overhang: 1px;
      --hinge-width: clamp(8px, 1.8vw, 12px);
      position: relative;
      width: var(--book-width);
      aspect-ratio: 1;
      transform-style: preserve-3d;
      transform: rotateX(-16deg) rotateY(var(--angle, 14deg));
      transform-origin: center;
      transition: transform 800ms cubic-bezier(.22, .7, .2, 1);
      will-change: transform;
    }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid rgb(25 31 43 / 14%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .cover-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .front .cover-image {
      width: 101.7%;
      max-width: none;
      transform: translateX(-1.7%);
    }

    .front {
      background: #fffbd1;
      border-radius: 3px 6px 6px 3px;
      box-shadow:
        0 24px 34px rgb(28 38 58 / 17%),
        inset -2px 0 2px rgb(24 31 43 / 10%);
      transform: translateZ(calc(var(--book-depth) / 2));
    }

    .front::before,
    .back::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(115deg,
        rgb(255 255 255 / 16%),
        transparent 24%,
        transparent 72%,
        rgb(23 30 42 / 4%));
    }

    .front::after,
    .back::after {
      content: "";
      position: absolute;
      inset-block: 0;
      width: var(--hinge-width);
      pointer-events: none;
    }

    .front::after {
      left: 0;
      border-right: 1px solid rgb(39 43 47 / 15%);
      background: linear-gradient(90deg,
        rgb(255 255 255 / 20%),
        rgb(40 44 48 / 8%) 72%,
        rgb(255 255 255 / 26%));
      box-shadow: 3px 0 5px rgb(31 35 39 / 7%);
    }

    .back {
      background: #f1eee6;
      border-radius: 6px 3px 3px 6px;
      box-shadow:
        0 24px 34px rgb(28 38 58 / 15%),
        inset 2px 0 2px rgb(24 31 43 / 10%);
      transform: rotateY(180deg) translateZ(calc(var(--book-depth) / 2));
    }

    .back::after {
      right: 0;
      border-left: 1px solid rgb(39 43 47 / 14%);
      background: linear-gradient(270deg,
        rgb(255 255 255 / 18%),
        rgb(40 44 48 / 8%) 72%,
        rgb(255 255 255 / 24%));
      box-shadow: -3px 0 5px rgb(31 35 39 / 7%);
    }

    .spine {
      inset: 0 auto 0 50%;
      width: var(--book-depth);
      background: white;
      border-radius: 3px;
      box-shadow:
        inset 3px 0 4px rgb(30 35 42 / 9%),
        inset -3px 0 4px rgb(30 35 42 / 9%);
      transform: translateX(-50%) rotateY(-90deg) translateZ(calc(var(--book-width) / 2));
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }

    .spine-crop {
      position: absolute;
      inset: 0 auto 0 50%;
      width: 8px;
      overflow: hidden;
      transform: translateX(-50%);
    }

    .spine-source {
      position: absolute;
      inset: 0 auto 0 0;
      width: auto;
      height: 100%;
      max-width: none;
    }

    .page-edge {
      position: absolute;
      border: 1px solid rgb(45 49 55 / 12%);
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }

    .fore-edge {
      inset: 0 auto 0 50%;
      width: var(--book-depth);
      background:
        linear-gradient(90deg,
          #ded8b7 0 var(--cover-board),
          transparent var(--cover-board) calc(100% - var(--cover-board)),
          #d7d2c9 calc(100% - var(--cover-board)) 100%),
        repeating-linear-gradient(0deg, #fffef9 0 3px, #dad8d0 3px 4px);
      transform: translateX(-50%) rotateY(90deg) translateZ(calc(var(--book-width) / 2));
      border-radius: 1px;
    }

    .top-edge,
    .bottom-edge {
      inset: 50% 0 auto;
      width: auto;
      height: var(--book-depth);
      background:
        linear-gradient(0deg,
          #d7d2c9 0 var(--cover-board),
          transparent var(--cover-board) calc(100% - var(--cover-board)),
          #ded8b7 calc(100% - var(--cover-board)) 100%),
        linear-gradient(0deg,
          #d8d4ca 0 1px,
          #fffef9 1px 34%,
          #e4e0d7 34% 40%,
          #fffef9 40% 72%,
          #e7e3da 72% 78%,
          #fbfaf5 78% 100%);
      border-radius: 1px;
    }

    .top-edge {
      transform: translateY(-50%) rotateX(90deg) translateZ(calc(var(--book-width) / 2));
    }

    .bottom-edge {
      transform: translateY(-50%) rotateX(-90deg) translateZ(calc(var(--book-width) / 2));
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      min-width: 88px;
      border: 1px solid #9aa1ae;
      border-radius: 999px;
      background: white;
      padding: 10px 16px;
      color: #273044;
      font: inherit;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: #24325f;
      background: #24325f;
      color: white;
    }

    button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }

    .status { min-height: 1.5em; margin-top: 12px; color: #687083; }

    .hint { margin-top: 4px; font-size: 13px; color: #8a91a0; }

    @media (prefers-reduced-motion: reduce) {
      .book { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>동화책 3D 미리보기</h1>
    <p>앞표지·책등·뒤표지를 직접 확인해 보세요.</p>

    <div class="scene" id="scene" tabindex="0" aria-label="3D 책 미리보기">
      <div class="book" id="book" aria-hidden="true">
        <div class="face front">
          <img class="cover-image" src="assets/book-front.jpg" alt="">
        </div>
        <div class="face spine">
          <span class="spine-crop">
            <img class="spine-source" src="assets/book-front.jpg" alt="">
          </span>
        </div>
        <div class="page-edge fore-edge"></div>
        <div class="page-edge top-edge"></div>
        <div class="page-edge bottom-edge"></div>
        <div class="face back">
          <img class="cover-image" src="assets/book-back.jpg" alt="">
        </div>
      </div>
    </div>

    <div class="controls" aria-label="책 방향 선택">
      <button type="button" data-view="front" aria-pressed="true">앞표지</button>
      <button type="button" data-view="spine" aria-pressed="false">책등</button>
      <button type="button" data-view="back" aria-pressed="false">뒤표지</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">앞표지</div>
    <p class="hint">좌우로 밀거나 화살표 키를 눌러도 전환됩니다.</p>
  </main>

  <script>
    const views = {
      front: { angle: 14, label: '앞표지' },
      spine: { angle: 40, label: '책등' },
      back: { angle: 194, label: '뒤표지' }
    };
    const order = ['front', 'spine', 'back'];
    const scene = document.querySelector('#scene');
    const book = document.querySelector('#book');
    const status = document.querySelector('#status');
    const buttons = [...document.querySelectorAll('[data-view]')];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let current = 'front';
    let startX = null;
    let introTimers = [];

    function cancelIntro() {
      introTimers.forEach(clearTimeout);
      introTimers = [];
    }

    function show(view) {
      cancelIntro();
      current = view;
      book.style.setProperty('--angle', `${views[view].angle}deg`);
      buttons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.view === view));
      });
      status.textContent = views[view].label;
    }

    function step(direction) {
      const index = order.indexOf(current);
      show(order[Math.max(0, Math.min(order.length - 1, index + direction))]);
    }

    buttons.forEach(button => button.addEventListener('click', () => show(button.dataset.view)));
    scene.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        step(event.key === 'ArrowRight' ? 1 : -1);
      }
    });
    scene.addEventListener('pointerdown', event => { startX = event.clientX; });
    scene.addEventListener('pointerup', event => {
      if (startX === null) return;
      const delta = event.clientX - startX;
      startX = null;
      if (Math.abs(delta) >= 35) step(delta < 0 ? 1 : -1);
    });

    // YES24 모바일의 첫 진입 회전과 같은 핵심 동작: 180도까지 돌린 뒤 앞면 복귀.
    if (!reducedMotion.matches) {
      introTimers = [
        setTimeout(() => book.style.setProperty('--angle', '194deg'), 500),
        setTimeout(() => {
          book.style.setProperty('--angle', '14deg');
          introTimers = [];
        }, 2400)
      ];
    }
  </script>
</body>
</html>
